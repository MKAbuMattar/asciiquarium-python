[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "asciiquarium"
version = "2.4.1"
description = "An aquarium/sea animation in ASCII art for your terminal"
readme = "README.md"
requires-python = ">=3.8"
license = "GPL-3.0-or-later"
authors = [
    {name = "Mohammad Abu Mattar", email = "info@mkabumattar.com"}
]
keywords = ["terminal", "ascii", "animation", "aquarium", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment",
]

dependencies = [
    "windows-curses>=2.4.1; sys_platform == 'win32' and python_version < '3.13'",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.0.0",
    "pytest>=7.0.0",
    "ruff>=0.6.0",
]

[project.scripts]
asciiquarium = "asciiquarium.main:main"

[project.urls]
Homepage = "https://mkabumattar.com/"
Repository = "https://github.com/MKAbuMattar/asciiquarium-python"
"Original Project" = "http://robobunny.com/projects/asciiquarium"
"Author Website" = "https://mkabumattar.com/"

# Ruff configuration
[tool.ruff]
line-length = 100
target-version = "py38"

# Enable specific rule sets
[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # function is too complex
]

# Exclude directories
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports in __init__.py

# Pytest configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
# The package is importable from the repo root without an editable install,
# which keeps `pytest` working with no setup step.
pythonpath = ["."]

# MyPy configuration
[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Set to true when ready for full type checking
ignore_missing_imports = true

# Per-module options
[[tool.mypy.overrides]]
module = ["curses", "curses.*", "windows_curses", "windows_curses.*"]
ignore_missing_imports = true
ignore_errors = true

[dependency-groups]
dev = []

[tool.hatch.build.targets.wheel]
packages = ["asciiquarium"]
include = ["LICENSE", "README.md"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build]
packages = ["asciiquarium"]
include = ["LICENSE", "README.md"]

[tool.hatch.envs.default]
dependencies = [
    "mypy>=1.0.0",
    "pytest>=7.0.0",
    "ruff>=0.6.0",
    "twine>=4.0.2",
]

[tool.hatch.envs.default.scripts]
# ruff formats and sorts imports, so black and isort are both gone. The "I"
# rules in [tool.ruff.lint] are what replaced isort; keep them selected.
fmt = [
    "ruff format asciiquarium tests scripts",
    "ruff check --fix asciiquarium tests scripts",
]
lint = [
    "ruff format --check asciiquarium tests scripts",
    "ruff check asciiquarium tests scripts",
    "mypy --ignore-missing-imports asciiquarium",
]
test = "pytest -q"